<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>isai_tamil</title>
    <link rel="icon" href="assets/favicon.png" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Unbounded:wght@400;500;600;700&family=Noto+Sans+Tamil:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>

    <!-- Entry screen — first thing visible on load -->
    <div id="entry-screen">
      <div id="entry-symbol"></div>
    </div>

    <div id="main-content">

      <!-- SVG filter for the name interference effect (animated by JS) -->
      <svg style="display:none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <filter id="name-filter" x="-10%" y="-20%" width="120%" height="140%">
            <feTurbulence id="name-turb" type="turbulence"
              baseFrequency="0.008 1.1" numOctaves="1" seed="1" result="noise" />
            <feDisplacementMap id="name-disp"
              in="SourceGraphic" in2="noise" scale="6"
              xChannelSelector="R" yChannelSelector="G" />
          </filter>
        </defs>
      </svg>

      <!-- Background video — starts (with audio) on entry click -->
      <video id="bg-video" loop muted>
        <source id="bg-video-source" src="" type="video/mp4" />
      </video>

      <!-- Background particles canvas -->
      <canvas id="bg-canvas"></canvas>

      <!-- Volume toggle button -->
      <button id="volume-btn">
        <i class="fa-solid fa-volume-high"></i>
      </button>

      <!-- Profile card -->
      <div id="profile-card">

        <!-- Section 1: avatar + name + status -->
        <div id="profile-main">
          <div id="avatar-wrapper">
            <img id="avatar" src="" alt="avatar" />
            <img id="avatar-decoration" src="" alt="" />
          </div>
          <div id="profile-info">
            <div id="profile-name">
              <div id="name-row">
                <div class="name-wrapper">
                  <span id="name-text"></span>
                  <span class="name-tooltip" id="name-tooltip"></span>
                </div>
                <div id="badges"></div>
              </div>
            </div>
            <p id="profile-status"></p>
          </div>
        </div>

        <!-- Section 2: Discord presence -->
        <div id="discord-presence">
          <div id="discord-avatar-wrapper">
            <img id="discord-avatar" src="" alt="discord avatar" />
            <img id="discord-status-icon" src="" alt="" />
            <span id="discord-status-dot" hidden></span>
          </div>
          <div id="discord-info">
            <span id="discord-username"></span>
            <span id="discord-activity"></span>
          </div>
        </div>

        <!-- Section 3: social links -->
        <div id="social-links"></div>

      </div>

    </div>

    <!-- Cursor sparkle trail canvas -->
    <canvas id="cursor-canvas"></canvas>

    <audio id="bgMusic" loop>
      <source src="assets/bgsong.mp3" type="audio/mp3">
    </audio>

    <script>
      const music = document.getElementById("bgMusic");
      document.addEventListener("click", () => {
        music.play().catch(() => {});
      }, { once: true });
    </script>
    <script src="js/config.js"></script>
    <script src="js/script.js"></script>
  </body>
</html>
